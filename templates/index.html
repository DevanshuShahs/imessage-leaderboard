<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reaction Leaderboard</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1 class="app-title">Reaction Leaderboard</h1>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <circle cx="8.5" cy="8.5" r="6" stroke="currentColor" stroke-width="1.6"/>
          <line x1="13.1" y1="13.1" x2="18" y2="18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <input
          id="chat-search"
          type="text"
          placeholder="Search group chats…"
          autocomplete="off"
          spellcheck="false"
        />
        <div id="search-results" class="search-results" hidden></div>
      </div>
    </div>
  </header>

  <main class="content">
    <div id="empty-state" class="state-panel">
      <p>Search for a group chat above to see its reaction leaderboard.</p>
    </div>

    <div id="loading-state" class="state-panel" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <p>Loading…</p>
    </div>

    <div id="error-state" class="state-panel error-panel" hidden>
      <p id="error-message"></p>
    </div>

    <div id="results" class="results" hidden>
      <section class="chat-header">
        <h2 id="chat-name"></h2>
        <div class="chat-stats">
          <div class="stat">
            <span id="stat-participants" class="stat-value">–</span>
            <span class="stat-label">Participants</span>
          </div>
          <div class="stat">
            <span id="stat-messages" class="stat-value">–</span>
            <span class="stat-label">Messages</span>
          </div>
          <div class="stat">
            <span id="stat-reactions" class="stat-value">–</span>
            <span class="stat-label">Reactions</span>
          </div>
        </div>
      </section>

      <section id="leaderboard" class="leaderboard"></section>
    </div>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
